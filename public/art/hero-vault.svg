    </linearGradient>
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF6D4"/><stop offset=".5" stop-color="#FFD54A"/><stop offset="1" stop-color="#C9931A"/>
    </linearGradient>
    <radialGradient id="core" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFE79A" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#2E7CF6" stop-opacity=".45"/>
      <stop offset="1" stop-color="#2E7CF6" stop-opacity="0"/>
